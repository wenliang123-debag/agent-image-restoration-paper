name: Weekly paper discovery

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-paper-discovery
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover recent papers
        run: python3 scripts/update_catalog.py

      - name: Validate generated files
        run: python3 scripts/validate_catalog.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="automation/paper-update-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add README.md automation/candidates.json
          git commit -m "chore: add newly discovered paper candidates"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: review newly discovered papers" \
            --body "Automated weekly arXiv discovery found new candidate papers. Review relevance, links, section assignment, and venue information before merging."
